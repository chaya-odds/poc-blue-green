name: BLUE Image CI

on:
  push:
    branches: [ "cloud-develope" ]
  pull_request:
    branches: [ "cloud-develope" ]
    paths:
      - 'blue.html'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        IMAGE_TAG=blue-${{ github.sha }}
        docker build . --file Dockerfile.blue --tag ghcr.io/${{ github.repository }}:$IMAGE_TAG
        docker tag ghcr.io/${{ github.repository }}:$IMAGE_TAG ghcr.io/${{ github.repository }}:blue-latest
        docker push ghcr.io/${{ github.repository }}:$IMAGE_TAG
        docker push ghcr.io/${{ github.repository }}:blue-latest
